services:
  # ───────────── Data Layer ─────────────
  mongodb:
    image: mongo:7
    container_name: edupredict-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: mongosh --eval "db.runCommand('ping').ok" --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ───────────── Streaming Layer ─────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: edupredict-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: edupredict-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # ───────────── HDFS Layer ─────────────
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: edupredict-namenode
    ports:
      - "9870:9870"   # Web UI
      - "9000:9000"   # HDFS
    environment:
      CLUSTER_NAME: edupredict
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
    volumes:
      - hdfs_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: edupredict-datanode
    depends_on:
      - namenode
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: 1
    volumes:
      - hdfs_datanode:/hadoop/dfs/data

  # ───────────── Spark Layer ─────────────
  spark-master:
    image: apache/spark:3.5.3
    container_name: edupredict-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"

  spark-worker:
    image: apache/spark:3.5.3
    container_name: edupredict-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    environment:
      SPARK_WORKER_MEMORY: 2G

  # ───────────── Backend API (FastAPI + ML) ─────────────
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: edupredict-api
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      MONGO_URI: mongodb://mongodb:27017
      KAFKA_BROKER: kafka:29092
      R_SERVICE_URL: http://r-service:8787
      HDFS_URL: http://namenode:9870
      SPARK_MASTER_URL: http://spark-master:8080
    volumes:
      - shared_data:/app/data
      - shared_models:/app/ml/models

  # ───────────── R Analytics Service ─────────────
  r-service:
    build:
      context: .
      dockerfile: r-analytics/Dockerfile
    container_name: edupredict-r-service
    ports:
      - "8787:8787"
    volumes:
      - shared_data:/app/data

  # ───────────── Web Dashboard (Nginx) ─────────────
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: edupredict-web
    ports:
      - "3001:80"
    depends_on:
      - api

volumes:
  mongo_data:
  hdfs_namenode:
  hdfs_datanode:
  shared_data:
  shared_models:
